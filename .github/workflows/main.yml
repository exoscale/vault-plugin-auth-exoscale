name: CI

on:
  push:
    branches:
    - '**'
    paths-ignore:
    - '**.md'
    tags-ignore:
    - 'v*' # Don't run CI tests on release tags

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make go.mk
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - run: make pre-check

      - run: make test-verbose
